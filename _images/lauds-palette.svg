<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      text { dominant-baseline: middle; text-anchor: middle; font-size: 11px; fill: #101010; }
      .hex { font-size: 10px; fill: #5F6166; }
      .name { font-weight: 600; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="240" fill="#FFFCF0" rx="8"/>

  <!-- Row 1: Base neutrals -->
  <text x="50" y="18" class="name" font-size="12" text-anchor="start">Base</text>
  <rect x="20" y="26" width="80" height="40" rx="4" fill="#FFFCF0" stroke="#D6D0C4" stroke-width="1.5"/>
  <text x="60" y="46" class="name">Paper</text>
  <text x="60" y="58" class="hex">#FFFCF0</text>

  <rect x="110" y="26" width="80" height="40" rx="4" fill="#F7F3E8" stroke="#D6D0C4" stroke-width="1"/>
  <text x="150" y="46" class="name">Bg alt</text>
  <text x="150" y="58" class="hex">#F7F3E8</text>

  <rect x="200" y="26" width="80" height="40" rx="4" fill="#EDE8DC" stroke="#D6D0C4" stroke-width="1"/>
  <text x="240" y="46" class="name">Raised</text>
  <text x="240" y="58" class="hex">#EDE8DC</text>

  <rect x="290" y="26" width="80" height="40" rx="4" fill="#D6D0C4" stroke="#D6D0C4" stroke-width="1"/>
  <text x="330" y="46" class="name">Border</text>
  <text x="330" y="58" class="hex">#D6D0C4</text>

  <rect x="380" y="26" width="80" height="40" rx="4" fill="#7B7D82" stroke="#D6D0C4" stroke-width="1"/>
  <text x="420" y="46" class="name" fill="#FFFCF0">Comment</text>
  <text x="420" y="58" class="hex" fill="#FFFCF0">#7B7D82</text>

  <rect x="470" y="26" width="80" height="40" rx="4" fill="#5F6166" stroke="#D6D0C4" stroke-width="1"/>
  <text x="510" y="46" class="name" fill="#FFFCF0">Muted</text>
  <text x="510" y="58" class="hex" fill="#FFFCF0">#5F6166</text>

  <rect x="560" y="26" width="80" height="40" rx="4" fill="#101010" stroke="#D6D0C4" stroke-width="1"/>
  <text x="600" y="46" class="name" fill="#FFFCF0">Foreground</text>
  <text x="600" y="58" class="hex" fill="#FFFCF0">#101010</text>

  <!-- Row 2: Accent colors - solid -->
  <text x="50" y="94" class="name" font-size="12" text-anchor="start">Accents</text>

  <!-- Orange -->
  <rect x="20" y="102" width="80" height="40" rx="4" fill="#B45A20"/>
  <text x="60" y="122" class="name" fill="#FFFCF0">Orange</text>
  <text x="60" y="134" class="hex" fill="#FFFCF0">#B45A20</text>

  <!-- Mint -->
  <rect x="110" y="102" width="80" height="40" rx="4" fill="#16866F"/>
  <text x="150" y="122" class="name" fill="#FFFCF0">Mint</text>
  <text x="150" y="134" class="hex" fill="#FFFCF0">#16866F</text>

  <!-- Red -->
  <rect x="200" y="102" width="80" height="40" rx="4" fill="#C1503F"/>
  <text x="240" y="122" class="name" fill="#FFFCF0">Red</text>
  <text x="240" y="134" class="hex" fill="#FFFCF0">#C1503F</text>

  <!-- Pink -->
  <rect x="290" y="102" width="80" height="40" rx="4" fill="#B34A72"/>
  <text x="330" y="122" class="name" fill="#FFFCF0">Pink</text>
  <text x="330" y="134" class="hex" fill="#FFFCF0">#B34A72</text>

  <!-- Purple -->
  <rect x="380" y="102" width="80" height="40" rx="4" fill="#7264A8"/>
  <text x="420" y="122" class="name" fill="#FFFCF0">Purple</text>
  <text x="420" y="134" class="hex" fill="#FFFCF0">#7264A8</text>

  <!-- Row 3: Soft variants -->
  <text x="50" y="168" class="name" font-size="12" text-anchor="start">Soft</text>

  <rect x="20" y="176" width="80" height="40" rx="4" fill="#F3D2B8" stroke="#D6D0C4" stroke-width="1"/>
  <text x="60" y="196" class="name">Orange</text>
  <text x="60" y="208" class="hex">#F3D2B8</text>

  <rect x="110" y="176" width="80" height="40" rx="4" fill="#BFE9DE" stroke="#D6D0C4" stroke-width="1"/>
  <text x="150" y="196" class="name">Mint</text>
  <text x="150" y="208" class="hex">#BFE9DE</text>

  <rect x="200" y="176" width="80" height="40" rx="4" fill="#F6C8BF" stroke="#D6D0C4" stroke-width="1"/>
  <text x="240" y="196" class="name">Red</text>
  <text x="240" y="208" class="hex">#F6C8BF</text>

</svg>
